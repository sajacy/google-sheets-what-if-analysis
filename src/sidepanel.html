<!doctype html>
<html>
  <head>
    <link rel="stylesheet" href="https://ssl.gstatic.com/docs/script/css/add-ons1.css">
    <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:opsz,wght,FILL,GRAD@24,200,0,0" />
    <link rel="stylesheet" href="https://fonts.googleapis.com/css?family=Open Sans|Roboto|Source Code Pro" />
    
    <style>
    #header {
      padding:10px;
      margin: 0;
      background-color: #4c8bf5; 
      font: bold 16px/24px Roboto,Helvetica,Arial,sans-serif;
      color: white;
    }
    
    #header>div {
      display: flex;
      justify-content: space-between;
    }

   #datatables {
      -moz-box-sizing: border-box;
      box-sizing: border-box;
      overflow-y: auto;
      position: absolute;
      width: 100%;
      top: 44px;
      bottom: 88px;
      z-index: 1;
    }

    #menuItems {
      position: absolute;
      top: 40px;
      left: 8px;
      padding: 4px;
      background: white;
      box-shadow: 0 2px 6px #0003;
      z-index: 2;
    }

    #advancedDt:not([open]) {
      display: none;
    }

    #advancedDt[open] {
      z-index: 1000;
    }

    .iconButton {
      min-width: 24px;
      height: 24px;
      padding: 0;
      border: 0;
      background: transparent;
      color: inherit;
    }

    .iconButton:hover {
      background: #8882;
    }

    .panelClose {
      position: absolute;
      top: 10px;
      right: 8px;
    }

    details:not([open]) > .panelClose {
      display: none;
    }

    details[open] > summary {
      padding-right: 40px;
    }

    .editor > div.actions {
      flex-flow: column;
      gap: 6px;
    }

    #message {
      -moz-box-sizing: border-box;
      box-sizing: border-box;
      position: absolute;
      bottom: 88px;
      left: 0px;
      width: 100%;
      padding: 8px;
      font: 12px/24px Roboto,Helvetica,Arial,sans-serif;
      background-color: #ffe395;
      display: none;
      z-index: 1001;
    }

    #message.active {
      display: block;
      overflow: hidden;
      animation-duration: 1s;
      animation-name: toast;
    }

    @keyframes toast {
      from { opacity: 0; }
      to { opacity: 1; }
    }

    details summary.button {
      margin: 8px !important;
    }
    
    details[open] summary.button {
      display:none;
    }

    button.delete {
      color: #b3261e;
    }

    button.delete:hover {
      background: #fce8e6;
    }

    details {
      border-bottom:1px solid #ddd;
      user-select: text;
    }

    details summary {
      margin: 0;
      background-color: #fff;
      padding: 10px 12px 8px 12px;
      font: 14px/24px Roboto,Helvetica,Arial,sans-serif;
      cursor:pointer;
      list-style: none;
      user-select: none;                 
    }
    
    .dragHandle {
      color: #666;
      cursor: grab;
      font-weight: bold;
      user-select: none;
    }

    .dragHandle:active {
      cursor: grabbing;
    }

    details[open] > summary .dragHandle {
      display: none;
    }

    summary.dropBefore {
      box-shadow: inset 0 2px #4c8bf5;
    }

    summary.dropAfter {
      box-shadow: inset 0 -2px #4c8bf5;
    }

    details summary:hover {
      background-color: #f3f3f3 !important;
    }

    details > summary::marker, /* Latest Chrome, Edge, Firefox */ 
    details > summary::-webkit-details-marker /* Safari */ {
      display: none;
    }
/*
    details summary>i  {
      position:absolute;
      right:8px;
      transition: all 0.25s linear;
    }

    details[open] summary>i {
      transform:rotate(180deg);
    }
*/
    details[open] {
      -moz-box-sizing: border-box;
      box-sizing: border-box;
      overflow-y: auto;
      position: absolute;
      width: 100%;
      top: 0px;
      bottom: 0px;
      z-index: 999;
      background-color: #fff;
    }

    details[open] summary {
      background-color: #d6e6ffde !important;
      text-shadow: #666 0px 0px 1px;
    }


    details .editor {
      box-sizing: border-box;
      padding: 8px;
      line-height: 0px;
      overflow: hidden;
    }

    .editor>div {
      display: flex;
      margin: 2px 0px 16px 0px;
      justify-content: space-between;
    }

    .editor label {
      display: block;
      margin-top: 16px;
      color: #666;
      font-size: 11px;
      line-height: 11px;
    }

    .editor input {
      height: 24px;
      line-height: 22px;
      width: 100%;
      outline: 0;
      border-width: 0 0 1px;
      background-color: #F6F6F6;
      box-sizing: border-box;
      font: 13px Roboto,Helvetica,Arial,sans-serif;
    }

    .editor input:focus {
      border-color: #4c8bf5;
      border-width: 0 0 2px;
    }

    .editor input + i {
      color: green;
    }

    button, .button, i {
      font: 12px/12px Roboto,Helvetica,Arial,sans-serif;
      border-radius: 4px;
      margin: 0px !important;
      cursor: pointer;
    }

    button>span, .button>span {
      display: flex !important;
      align-items: center;
      margin: 2px 0px 2px 0px;
    }

    button i + span, .button i + span {
      width:100%;
      line-height: 24px;
    }

    a {
      font-size: 11px;
      line-height:24px;
    }

    details textarea {
      margin: 4px 0px 4px 0px;
      height:120px;
      width:100%;
      font: 12px Source Code Pro, Roboto Mono, Lucida Console, monospace;
      border: none;
      outline: none;
      background-color: #F6F6F6;
    }
    </style>
  </head>
  <body>
    <h1 id="header">
      <div>
        <button id="whatifMenu" class="iconButton material-symbols-outlined" aria-label="Menu" aria-controls="menuItems" aria-expanded="false">menu</button>
        <span>DataTables</span>
        <i id="dtRecalcAll" role="img" title="Refresh All DataTables" class="material-symbols-outlined">refresh</i>
      </div>
    </h1>
    <div id="menuItems" hidden><button id="openAdvanced">Power Tools</button></div>
    <div id="message" role="status"></div>
    <div id="container">
      <div id="datatables">
        <!-- New DataTable -->
        <details id="addNew">
          <summary class="button blue"><span><i class="material-symbols-outlined">add</i><span>New</span></span></summary>
          <div class="editor">
            <label>Name (Optional)</label>
            <div><input class="name"></div>
            <label>Range</label>
            <div><input class="range"> <i role="img" alt="Capture Selected Range" class="material-symbols-outlined">border_all</i></div>
            <label>Column Input</label>
            <div><input class="colinput"> <i role="img" alt="Capture Selected Range" class="material-symbols-outlined">border_all</i></div>
            <label>Row Input (for bivariate models, otherwise blank)</label>
            <div><input class="rowinput"> <i role="img" alt="Capture Selected Range" class="material-symbols-outlined">border_all</i></div>
            <div><a href="#">Edit JSON</a></div>
            <span class="json" hidden>
              <label>JSON</label>
              <textarea>{ "name": "", "range": "", "colinput": "", "rowinput": "" }</textarea>
            </span>
            <div class="actions">
              <button class="cancel grey"><span><i class="material-symbols-outlined">cancel</i> <span>Cancel</span></span></button>
              <button class="saveonly"><span><i class="material-symbols-outlined">save</i> <span>Save</span></span></button>
              <button class="save blue"><span><i class="material-symbols-outlined">auto_fix</i> <span>Save &amp; Calc</span></span></button>
            </div>
          </div>
        </details>
        <!-- DataTable List -->
        <span id="dtList">
        </span>
        <!-- Power Tools -->
        <details id="advancedDt">
          <summary>Power Tools</summary>
          <button id="cancelAdvanced" class="iconButton panelClose material-symbols-outlined" aria-label="Close Power Tools" title="Close">close</button>
          <div class="editor">
            <div>
              <button id="dtReload" ><span><i class="material-symbols-outlined">history</i> <span>Revert to last save</span></span></button>
              <button id="copyToClipboard"><span><i class="material-symbols-outlined">content_copy</i> <span>Copy</span></span></button>
            </div>
            <span class="json">
              <label>JSON</label>
              <textarea style="height:300px !important" id="allDt"></textarea>
            </span>
            <div class="actions">
              <button id="saveAll" class="blue">Import</button>
            </div>
          </div>
        </details>
      </div>
    </div>
    <div class="sidebar bottom">
      <span class="gray">&copy; Jeffrey Yang, 2022
        <a target="_blank" href="https://github.com/sajacy/google-sheets-what-if-analysis#usage">User Guide</a> | 
        <a target="_blank" href="https://github.com/sajacy/google-sheets-what-if-analysis/issues">Feedback</a>
      </span>
    </div>
    <script>
      const SEM = { 
        // semaphore that is held when syncing JSON from user input, capture buttons, or save actions. 
        dtSync: null,

        // timeout ref, to be reset if multiple messages are triggered within the message timeout 
        messageTimeout: null
      }

      function safeParse(str, defaultVal) {
        try {
            return JSON.parse(str);
        } catch (e) {
          return defaultVal;
        }
      }

      function message(e, obj) {
        const msgEl = document.querySelector("#message");
        msgEl.textContent = e + (obj ? ` Context: ${JSON.stringify(obj)}` : "");
        msgEl.classList.add("active");

        if(SEM.messageTimeout) { clearTimeout(SEM.messageTimeout); }
        SEM.messageTimeout = setTimeout(function() {
          const msgEl = document.querySelector("#message");
          msgEl.textContent = "";
          msgEl.classList.remove("active");
        }, 4_000);
      }

      function viewDt(idx, config) {
        if(!DOMRefs.dt[idx].open) {
          message(`Viewing ${config.name}...`)
          google.script.run
            .withUserObject({ "idx": idx })
            .withFailureHandler(message)
            .focusDataTable(idx);

          // Close other DataTable sections
          // HACK: don't try to mutate the DOM el for this handler (it will cancel the opening)
          DOMRefs.dt.filter((e,i) => i != idx).forEach(el => el.open = false);
        }
      }

      function recalcDt(idx) {
        message("Recalculating...");
        google.script.run
          .withUserObject({ "idx": idx })
          .withSuccessHandler(() => message("Done."))
          .withFailureHandler(message)
          .recalcDataTable(idx);
      }     

      /*
        Config Management

        Be careful to not allow dirty state on the UI after calling backends:
        - loadDt, calls fetchDataTables
        - deleteDt, calls upsertDataTable
        - saveDt, calls upsertDataTable (with single dt config)
        - importDt, calls 
      */
      function loadDt() {
        message("Loading...");
        google.script.run
          .withSuccessHandler(function(dt) { 
            renderDataTables(dt);
            message("DataTables loaded.");
          })
          .withFailureHandler(message)
          .fetchDataTables();
      }
      /** Delete a DataTable
       * idx: the index to delete
       * config: the config.name may change, so pass the config object (by reference)
       */
      function deleteDt(idx, config) {
        if(confirm("Are you sure you want to delete " + config.name + "?")) {
          message("Deleting...");
          google.script.run
            .withUserObject({ "idx": idx })
            .withSuccessHandler(function(dt) { 
              renderDataTables(dt);
              message("Deleted.");
            })
            .withFailureHandler(message)
            .upsertDataTable(idx, null);

        }
      }

      function saveDt(idx, recalc) {
        const isNew = idx === -1;
        const domEl = DOMRefs.resolve(idx);
        const json = safeParse(domEl.querySelector("textarea").value, null);

        if (!json || typeof json !== "object" || Array.isArray(json)) {
          message("Invalid config.");
          return;
        }
        if (!json.range) {
          message("Must have a range");
          return;
        }
        if (!json.colinput && !json.rowinput) {
          message("Must have at least a column or row input.");
          return;
        }
        if (isNew && (json.name == null ||
            (typeof json.name === "string" && !json.name.trim()))) {
          json.name = "New DataTable";
        }

        const saveButtons = domEl.querySelectorAll(".save, .saveonly");
        saveButtons.forEach(button => { button.disabled = true; });
        message(recalc ? "Saving and calculating..." : "Saving...");
        google.script.run
          .withSuccessHandler(function(dt) {
            saveButtons.forEach(button => { button.disabled = false; });
            renderDataTables(dt);
            if (isNew) {
              domEl.open = false;
              wireEditorUi(-1, {name: "New DataTable", range: ""});
              domEl.querySelector(".json").hidden = true;
            }
            const savedIdx = isNew ? dt.length - 1 : idx;
            DOMRefs.dt[savedIdx].open = true;
            if (recalc) {
              recalcDt(savedIdx);
            } else {
              message("Saved.");
            }
          })
          .withFailureHandler(function(err) {
            saveButtons.forEach(button => { button.disabled = false; });
            message(err.message);
          })
          .upsertDataTable(idx, json);
      }

      function importDt() {
        if (DOMRefs.saveAll.disabled) return;
        const json = DOMRefs.allDt.value;
        if (!Array.isArray(safeParse(json, null))) {
          message("Import must be a valid JSON array of DataTables.");
          return;
        }
        if (!confirm("Replace all saved DataTables with this JSON?")) return;

        DOMRefs.saveAll.disabled = true;
        message("Validating import...");
        google.script.run
          .withSuccessHandler(function(dt) {
            DOMRefs.saveAll.disabled = false;
            DOMRefs.advancedDt.open = false;
            renderDataTables(dt);
            message("Imported.");
          })
          .withFailureHandler(function(err) {
            DOMRefs.saveAll.disabled = false;
            message(err.message);
          })
          .importDataTables(json);
      }

      /**
       * Editor event handlers
       * 
       *  - captureRange: Button
       *  - cancelUi: cancel / close button
       *  - jsonUi: "Edit JSON"
       *  - onEditForm : fires onInput of ["name","range","colinput","rowinput"]
       *  - onEditJSON : fires when JSON is edited, rectifies form for idx
       */
      function captureRange(idx, selector) {
          google.script.run
            .withUserObject({ "idx": idx })
            .withSuccessHandler(function(val, rto) {
              const domEl = DOMRefs.resolve(rto.idx);
              const inputEl = domEl.querySelector(selector);
              inputEl.value = val;
              inputEl.dispatchEvent(new Event('input'));
            })
            .withFailureHandler(message)
            .captureRange();
      }

      function cancelUi(idx) {
        const domEl = DOMRefs.resolve(idx);
        domEl.open = false;
      }

      function jsonUi(idx) {
        const domEl = DOMRefs.resolve(idx);
        domEl.querySelector(".json").toggleAttribute("hidden");
      }

      // fired from any onInput event on the form
      function onEditForm(idx, config, field) {
        // console.log(`onEditForm(${JSON.stringify(arguments)})`);
        const domEl = DOMRefs.resolve(idx);
        // a specific input as modified, update config
        const inputEl = domEl.querySelector("input." + field);
        config[field] = inputEl.value;

        // update UI
        domEl.querySelector("textarea").value = JSON.stringify(config,undefined,2);
        // update title text on non-addNew form:
        if(!!domEl.querySelector("span." + field)) {
          domEl.querySelector("span." + field).innerText = config[field] || "[blank]";
        }
      }

      // textarea was modified, rectify all other inputs
      function onEditJson(idx, config) {
        // console.log(`onEditJson(${JSON.stringify(arguments)})`);
        const domEl = DOMRefs.resolve(idx);
        
        // parse JSON
        const json = safeParse(domEl.querySelector("textarea").value, config);

        if (!json || typeof json !== "object" || Array.isArray(json)) return;

        // update config
        config.name = json.name;
        config.range = json.range;
        config.colinput = json.colinput;
        config.rowinput = json.rowinput || null;

        // update UI
        domEl.querySelector("input.name").value = config.name;
        domEl.querySelector("input.range").value = config.range;
        domEl.querySelector("input.colinput").value = config.colinput;
        domEl.querySelector("input.rowinput").value = config.rowinput;
        // update title text on non-addNew form:
        if(domEl.querySelector("span.name")) {
          domEl.querySelector("span.name").innerText = config.name || "[blank]";
        }
      }

      function wireEditorUi(idx, config) {
        const domEl = DOMRefs.resolve(idx);
        domEl.querySelector(".cancel").onclick = function(e) { cancelUi(idx); };
        domEl.querySelector(".save").onclick = function(e) { saveDt(idx, true); };
        domEl.querySelector(".saveonly").onclick = function(e) { saveDt(idx, false); };
        domEl.querySelector("a").onclick = function(e) { jsonUi(idx); };

        // wire up form inputs to update JSON
        const nameInput = domEl.querySelector("input.name");
        nameInput.value = config.name || "";
        nameInput.oninput = function(e) { onEditForm(idx, config, "name"); };

        const rangeInput = domEl.querySelector("input.range");
        rangeInput.value = config.range || "";
        rangeInput.oninput = function(e) { onEditForm(idx, config, "range"); };

        const colInput = domEl.querySelector("input.colinput");
        colInput.value = config.colinput || "";
        colInput.oninput = function(e) { onEditForm(idx, config, "colinput"); };

        const rowInput = domEl.querySelector("input.rowinput");
        rowInput.value = config.rowinput || "";
        rowInput.oninput = function(e) { onEditForm(idx, config, "rowinput"); };

        domEl.querySelector("textarea").value = JSON.stringify(config, undefined, 2);
        const title = domEl.querySelector("span.name");
        if (title) title.textContent = config.name;

        domEl.querySelector("textarea").oninput = function(e) { onEditJson(idx, config); }

          // wire up i.click -> activeRange to update forms
          domEl.querySelector(".range+i").onclick = function(e) { captureRange(idx, ".range"); };
          domEl.querySelector(".colinput+i").onclick = function(e) { captureRange(idx, ".colinput"); };
          domEl.querySelector(".rowinput+i").onclick = function(e) { captureRange(idx, ".rowinput"); };
      }

      function reorderDt(fromIdx, toIdx, restoreFocus) {
        if (fromIdx === toIdx || !DOMRefs.dt[fromIdx] || !DOMRefs.dt[toIdx]) return;
        const dt = JSON.parse(DOMRefs.allDt.defaultValue);
        const [config] = dt.splice(fromIdx, 1);
        dt.splice(toIdx, 0, config);
        saveTableOrder(dt, () => {
          if (restoreFocus) DOMRefs.dt[toIdx].querySelector(".dragHandle").focus();
          message("Order saved.");
        });
      }

      function copyDt(idx) {
        const dt = JSON.parse(DOMRefs.allDt.defaultValue);
        dt.splice(idx + 1, 0, dt[idx]);
        saveTableOrder(dt, () => {
          const copy = DOMRefs.dt[idx + 1];
          copy.open = true;
          copy.querySelector("input.name").focus();
          message("DataTable copied.");
        });
      }

      function saveTableOrder(dt, onSaved) {
        if (DOMRefs.saveAll.disabled) return;
        DOMRefs.saveAll.disabled = true;
        message("Saving DataTables...");
        google.script.run
          .withSuccessHandler(function(savedDt) {
            DOMRefs.saveAll.disabled = false;
            renderDataTables(savedDt);
            onSaved();
          })
          .withFailureHandler(function(err) {
            DOMRefs.saveAll.disabled = false;
            message(err.message);
          })
          .importDataTables(JSON.stringify(dt), true);
      }

      /** Use the saved indexes so drag, keyboard, and editor actions agree. */
      function wireReorderUi(summary, idx) {
        const handle = summary.querySelector(".dragHandle");
        handle.onclick = (e) => {
          e.preventDefault();
          e.stopPropagation();
        };
        handle.onkeydown = (e) => {
          if (e.key !== "ArrowUp" && e.key !== "ArrowDown") return;
          e.preventDefault();
          reorderDt(idx, idx + (e.key === "ArrowUp" ? -1 : 1), true);
        };
        handle.ondragstart = (e) => {
          if (DOMRefs.saveAll.disabled) {
            e.preventDefault();
            return;
          }
          DOMRefs.dragIdx = idx;
          e.dataTransfer.effectAllowed = "move";
          e.dataTransfer.setData("text/plain", String(idx));
        };
        handle.ondragend = () => { DOMRefs.dragIdx = null; };
        summary.ondragover = (e) => {
          const fromIdx = DOMRefs.dragIdx;
          if (fromIdx === null || fromIdx === idx) return;
          e.preventDefault();
          e.dataTransfer.dropEffect = "move";
          summary.classList.add(fromIdx > idx ? "dropBefore" : "dropAfter");
        };
        summary.ondragleave = (e) => {
          if (!summary.contains(e.relatedTarget)) {
            summary.classList.remove("dropBefore", "dropAfter");
          }
        };
        summary.ondrop = (e) => {
          const fromIdx = DOMRefs.dragIdx;
          if (fromIdx === null) return;
          e.preventDefault();
          summary.classList.remove("dropBefore", "dropAfter");
          reorderDt(fromIdx, idx, false);
        };
      }

      function renderDataTables(dt) {
        // Keep the loaded list available while Power Tools edits value.
        DOMRefs.allDt.defaultValue = JSON.stringify(dt, undefined, 2);
        DOMRefs.allDt.value = DOMRefs.allDt.defaultValue;
        
        // release existing DOM references, remove from document:
        DOMRefs.dt = [];
        DOMRefs.dtList.replaceChildren();
        
        // start rendering new DOM elements:
        dt.forEach(function(config, idx) {
          if (!config) return;

          // create a new detail section
          const domEl = document.createElement("details");
          domEl.innerHTML = 
          `<summary><button type="button" class="dragHandle iconButton" draggable="true"
              aria-label="Reorder DataTable with Up and Down arrows"
              title="Drag to reorder or use Up and Down arrows">::</button><span class="name"></span></summary>
            <button class="cancel iconButton panelClose material-symbols-outlined" aria-label="Close DataTable" title="Close">close</button>
            <div class="editor">
              <label>Name</label>
              <div>
                <input class="name">
              </div>
              <label>Range</label>
              <div>
                <input class="range">
                <i role="img" alt="Capture Selected Range" class="rangecapture material-symbols-outlined">border_all</i>
              </div>
              <label>Column Input</label>
              <div>
                <input class="colinput">
                <i role="img" alt="Capture Selected Range" class="colinputcapture material-symbols-outlined">border_all</i>
              </div>
              <label>Row Input</label>
              <div>
                <input class="rowinput">
                <i role="img" alt="Capture Selected Range" class="rowinputcapture material-symbols-outlined">border_all</i>
              </div>
              <div><a href="#">Edit JSON</a></div>
              <span class="json" hidden>
                <label>JSON</label>
                <textarea></textarea>
              </span>
              <div class="actions">
                <button class="copy"><span><i class="material-symbols-outlined">content_copy</i> <span>Copy</span></span></button>
                <button class="delete"><span><i class="material-symbols-outlined">delete</i> <span>Delete</span></span></button>
                <button class="recalc"><span><i class="material-symbols-outlined">calculate</i> <span>Recalculate</span></span></button>
                <button class="saveonly"><span><i class="material-symbols-outlined">save</i> <span>Save</span></span></button>
                <button class="save blue"><span><i class="material-symbols-outlined">auto_fix</i> <span>Save &amp; Calc</span></span></button>
              </div>
            </div>
          `;

          // save a global-scope reference to the DOM element 
          // then attach it to the document
          DOMRefs.dt[idx] = domEl;
          DOMRefs.dtList.appendChild(domEl);

          // wire non-addNew handlers with closures on indexes and config (never DOM elements!)
          const summary = domEl.querySelector("summary");
          summary.onclick = function(e) { viewDt(idx, config); };
          wireReorderUi(summary, idx);
          domEl.querySelector(".recalc").onclick = function(e) { recalcDt(idx); };
          domEl.querySelector(".copy").onclick = function(e) { copyDt(idx); };
          domEl.querySelector(".delete").onclick = function(e) { deleteDt(idx, config); };
          
          // wire editor handlers
          wireEditorUi(idx, config);

        });
      }

      function init() {
        // wire up hamburger menu:
        const menuButton = document.querySelector("#whatifMenu");
        const menuItems = document.querySelector("#menuItems");
        function setMenuOpen(open) {
          menuItems.hidden = !open;
          menuButton.setAttribute("aria-expanded", String(open));
        }
        menuButton.onclick = () => setMenuOpen(menuItems.hidden);

        // power tools
        document.querySelector("#openAdvanced").onclick = () => {
          setMenuOpen(false);
          DOMRefs.advancedDt.open = true;
        };
        DOMRefs.advancedDt.querySelector("summary").onclick = (e) => e.preventDefault();
        DOMRefs.cancelAdvanced.onclick = () => { DOMRefs.advancedDt.open = false; };
        DOMRefs.saveAll.onclick = () => importDt();
        DOMRefs.copyToClipboard.onclick = function(e) { navigator.clipboard.writeText(DOMRefs.allDt.value); message("Copied."); }
        DOMRefs.dtReload.onclick = loadDt;
        if (DOMRefs.dtRecalcAll) { DOMRefs.dtRecalcAll.onclick = function() { recalcDt(Infinity); }; }

        // wire addNew form:
        DOMRefs.addNew.ontoggle = function(e) { if(e.target.open) { e.target.querySelector("input.range").focus(); } };
        wireEditorUi(-1, { "name": "New DataTable", "range": "" })

        // load data tables
        loadDt();
      }

      const DOMRefs = {
        resolve: function(idx) { return (idx == -1) ? DOMRefs.addNew : DOMRefs.dt[idx]; },
        // DOM elements corresponding to async loaded datatables
        dt: [],
        dragIdx: null,
        dtList: document.querySelector("#dtList"),
        dtRecalcAll: document.querySelector("#dtRecalcAll"),

        // Create New
        addNew: document.querySelector("#addNew"),

        // Power Tools
        advancedDt: document.querySelector("#advancedDt"),
        saveAll: document.querySelector("#saveAll"),
        cancelAdvanced: document.querySelector("#cancelAdvanced"),
        copyToClipboard: document.querySelector("#copyToClipboard"),
        allDt: document.querySelector("#allDt"),
        dtReload: document.querySelector("#dtReload")
      }

      init();
    </script>
  </body>
</html>
